<h2>{{ produto }}</h2>

<p>Preço: R$ {{ preco }},00</p>

<p>
  Quantidade:

  <button
    [disabled]="quantidade === 1"
    (click)="diminuir()">
    -
  </button>

  {{ quantidade }}

  <button (click)="aumentar()">
    +
  </button>
</p>

<p>
  Total: R$ {{ preco * quantidade }},00
</p>

<button (click)="adicionarCarrinho()">
  Adicionar ao carrinho
</button>

<p>{{ mensagem }}</p>
