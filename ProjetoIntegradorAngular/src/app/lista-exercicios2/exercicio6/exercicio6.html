<h2>Lista de nomes</h2>

<p>Quantidade total de nomes: {{ nomes.length }}</p>

<button (click)="removerUltimo()">Remover último nome</button>
<button (click)="limparLista()">Limpar lista</button>
<button (click)="restaurarLista()">Restaurar lista inicial</button>

<p *ngIf="nomes.length === 0">Nenhum nome cadastrado</p>

<ul *ngIf="nomes.length > 0">
  <li *ngFor="let nome of nomes; let i = index">
    {{ i + 1 }} - {{ nome }}
  </li>
</ul>
